<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastView</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-vsc-dark-plus.min.css"
        rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <style>
        :root {
            --vscode-bg: #1e1e1e;
            --vscode-sidebar: #252526;
            --vscode-border: #333333;
            --vscode-active: #37373d;
            --vscode-accent: #007acc;
        }

        body {
            background-color: var(--vscode-bg);
            font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e3e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }

        .subdir {
            border-left: 1px solid #444;
            margin-left: 18px;
        }

        pre[class*="language-"] {
            margin: 0 !important;
            padding: 24px !important;
            background: transparent !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
        }

        pre.code-nowrap[class*="language-"],
        pre.code-nowrap {
            overflow-x: auto;
            max-width: 100%;
        }

        pre.code-wrap[class*="language-"],
        pre.code-wrap[class*="language-"] code[class*="language-"],
        pre.code-wrap,
        pre.code-wrap code,
        code.code-wrap {
            white-space: pre-wrap !important;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
        }

        pre.code-nowrap[class*="language-"] code[class*="language-"],
        pre.code-nowrap code,
        code.code-nowrap {
            white-space: pre !important;
        }

        code[class*="language-"] {
            font-family: inherit !important;
        }

        .md-preview {
            padding: 24px 32px;
            max-width: 900px;
            line-height: 1.65;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        .md-preview h1,
        .md-preview h2,
        .md-preview h3 {
            color: #e8e8e8;
            font-weight: 600;
            margin: 1.25em 0 0.5em;
        }

        .md-preview h1 {
            font-size: 1.75em;
            border-bottom: 1px solid #444;
            padding-bottom: 0.3em;
        }

        .md-preview h2 {
            font-size: 1.35em;
            border-bottom: 1px solid #333;
            padding-bottom: 0.25em;
        }

        .md-preview a {
            color: #3794ff;
        }

        .md-preview code {
            font-family: "JetBrains Mono", "Fira Code", Menlo, monospace;
            font-size: 0.9em;
            background: #2d2d2d;
            padding: 0.15em 0.35em;
            border-radius: 4px;
        }

        .md-preview pre {
            background: #252526;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1em 0;
        }

        .md-preview pre code {
            background: transparent;
            padding: 0;
        }

        .md-preview blockquote {
            border-left: 4px solid #007acc;
            margin: 1em 0;
            padding-left: 1em;
            color: #aaa;
        }

        .md-preview ul,
        .md-preview ol {
            margin: 0.5em 0;
            padding-left: 1.5em;
        }

        .md-preview table {
            border-collapse: collapse;
            margin: 1em 0;
        }

        .md-preview th,
        .md-preview td {
            border: 1px solid #444;
            padding: 6px 12px;
        }

        .preview-error {
            margin: 12px 16px;
            padding: 10px 14px;
            border-radius: 6px;
            background: #3a1f1f;
            color: #f48771;
            font-size: 12px;
            font-family: inherit;
        }

        iframe {
            background: white;
            width: 100%;
            height: 100%;
            border: none;
        }

        .file-row:hover {
            background-color: #2a2d2e;
        }

        .file-row.active {
            background-color: var(--vscode-active);
            color: #fff;
            box-shadow: inset 2px 0 0 var(--vscode-accent);
        }

        .lucide {
            width: 14px;
            height: 14px;
            stroke-width: 2px;
        }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            max-width: 200px;
            padding: 0 10px;
            height: 35px;
            font-size: 12px;
            color: #969696;
            border-right: 1px solid #252526;
            background: #2d2d2d;
            transition: background 0.15s, color 0.15s;
        }

        .tab-item:hover {
            background: #323232;
            color: #ccc;
        }

        .tab-item.active {
            background: #1e1e1e;
            color: #fff;
            border-top: 1px solid var(--vscode-accent);
        }

        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            border-radius: 4px;
            opacity: 0.6;
        }

        .tab-close:hover {
            opacity: 1;
            background: #444;
        }

        .dir-refresh {
            opacity: 0;
            transition: opacity 0.15s;
        }

        .file-row:hover .dir-refresh {
            opacity: 0.7;
        }

        .dir-refresh:hover {
            opacity: 1 !important;
            color: #fff;
        }
    </style>
</head>

<body class="text-gray-400 h-screen flex overflow-hidden selection:bg-blue-500/30">

    <aside id="sidebar" class="w-64 flex-shrink-0 bg-[#252526] flex flex-col border-r border-[#333] select-none">
        <div class="px-4 py-3 flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Explorer</span>
            <button type="button" id="btn-refresh-workspace"
                class="p-0.5 rounded hover:text-white transition-colors text-gray-500"
                title="Reload root folder listing and refresh the active file tab (tabs stay open)"
                aria-label="Reload root folder listing and refresh the active file tab">
                <i data-lucide="refresh-cw" class="w-3 h-3"></i>
            </button>
        </div>
        <div id="file-list" class="flex-1 overflow-y-auto overflow-x-hidden py-1 text-[13px]">
        </div>
    </aside>
    <div id="resizer"
        class="w-1 -ml-0.5 cursor-col-resize hover:bg-[#007acc] transition-colors bg-transparent z-10 active:bg-[#007acc]">
    </div>

    <main class="flex-1 flex flex-col overflow-hidden bg-[#1e1e1e]">
        <div id="tab-bar"
            class="h-9 bg-[#252526] flex items-end overflow-x-auto overflow-y-hidden border-b border-[#111] shrink-0">
        </div>
        <div class="h-9 bg-[#252526] flex items-center justify-between px-4 border-b border-[#111] shrink-0">
            <div class="flex items-center gap-2">
                <button type="button" id="btn-wrap"
                    class="hidden px-3 py-1 rounded text-[10px] uppercase font-bold transition-all bg-[#333] text-gray-400 hover:text-white"
                    title="Toggle word wrap for the current file">Wrap</button>
            </div>
            <div id="html-toggle" class="hidden flex bg-[#333] rounded p-0.5">
                <button type="button" id="btn-preview"
                    class="px-3 py-1 rounded text-[10px] uppercase font-bold transition-all">Preview</button>
                <button type="button" id="btn-code"
                    class="px-3 py-1 rounded text-[10px] uppercase font-bold transition-all">Code</button>
            </div>
        </div>

        <div id="content-area" class="flex-1 overflow-hidden relative">
            <div id="welcome" class="absolute inset-0 flex flex-col items-center justify-center space-y-3 opacity-10">
                <i data-lucide="terminal" class="w-20 h-20"></i>
                <p class="text-sm font-medium tracking-widest">WORKSPACE</p>
            </div>
            <div id="file-view" class="hidden absolute inset-0 overflow-auto"></div>
        </div>
    </main>

    <script>
        const BASE_URL = '/my-files/';
        let tabIdSeq = 0;
        const tabs = [];
        const tabsByPath = new Map();
        let activeTabId = null;

        function bustUrl(path) {
            const base = BASE_URL + path;
            const sep = base.includes('?') ? '&' : '?';
            return `${base}${sep}_=${Date.now()}`;
        }

        function isMediaPath(path) {
            return /\.(png|jpg|jpeg|gif|webp|pdf)$/i.test(path);
        }

        function isMarkdownPath(path) {
            return /\.(md|markdown)$/i.test(path);
        }

        function tabHasPreview(tab) {
            return tab.isHtml || tab.isMarkdown;
        }

        function markdownLibsReady() {
            return typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId) || null;
        }

        function collectExpandedPaths() {
            const paths = new Set();
            document.querySelectorAll('.subdir:not(.hidden)').forEach(sub => {
                const row = sub.previousElementSibling;
                if (row && row.dataset.path) paths.add(row.dataset.path);
            });
            return paths;
        }

        function setRowExpanded(row, subContainer, expanded) {
            const chevron = row.querySelector('.dir-chevron');
            if (expanded) {
                subContainer.classList.remove('hidden');
                if (chevron) chevron.setAttribute('data-lucide', 'chevron-down');
            } else {
                subContainer.classList.add('hidden');
                if (chevron) chevron.setAttribute('data-lucide', 'chevron-right');
            }
        }

        async function renderTree(path, container, expandedPaths) {
            try {
                const res = await fetch(`${BASE_URL}${path}`, { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to fetch directory');
                const files = await res.json();
                container.replaceChildren();

                files.sort((a, b) => (b.type === 'directory') - (a.type === 'directory'));

                for (const file of files) {
                    const isDir = file.type === 'directory';
                    const fullPath = path + file.name + (isDir ? '/' : '');

                    const itemWrapper = document.createElement('div');
                    const row = document.createElement('div');
                    row.className = 'file-row flex items-center px-4 py-[3px] cursor-pointer transition-colors';
                    row.dataset.path = fullPath;
                    row.dataset.isDir = isDir ? 'true' : 'false';

                    const chevron = document.createElement('i');
                    chevron.className = `dir-chevron mr-1.5 shrink-0 ${isDir ? 'text-gray-500' : 'text-blue-400/70'}`;
                    chevron.setAttribute('data-lucide', isDir ? 'chevron-right' : 'file-text');

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'truncate flex-1 min-w-0';
                    nameSpan.textContent = file.name;

                    row.appendChild(chevron);
                    row.appendChild(nameSpan);

                    if (isDir) {
                        const refreshBtn = document.createElement('button');
                        refreshBtn.type = 'button';
                        refreshBtn.className = 'dir-refresh ml-1 shrink-0 p-0.5 rounded';
                        refreshBtn.title = 'Refresh this folder listing';
                        refreshBtn.setAttribute('aria-label', 'Refresh this folder listing');
                        const refreshIcon = document.createElement('i');
                        refreshIcon.setAttribute('data-lucide', 'refresh-cw');
                        refreshIcon.className = 'w-3 h-3';
                        refreshBtn.appendChild(refreshIcon);
                        row.appendChild(refreshBtn);

                        const subContainer = document.createElement('div');
                        subContainer.className = 'subdir hidden';

                        refreshBtn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const wasExpanded = !subContainer.classList.contains('hidden');
                            subContainer.replaceChildren();
                            const loading = document.createElement('div');
                            loading.className = 'px-8 py-1 text-[10px] text-gray-600';
                            loading.textContent = 'Loading...';
                            subContainer.appendChild(loading);
                            if (wasExpanded) subContainer.classList.remove('hidden');
                            await renderTree(fullPath, subContainer, null);
                            if (wasExpanded) {
                                setRowExpanded(row, subContainer, true);
                                lucide.createIcons();
                            }
                        });

                        row.addEventListener('click', async (e) => {
                            if (e.target.closest('.dir-refresh')) return;
                            e.stopPropagation();
                            const isHidden = subContainer.classList.contains('hidden');
                            if (isHidden) {
                                setRowExpanded(row, subContainer, true);
                                lucide.createIcons();
                                if (subContainer.childElementCount === 0) {
                                    subContainer.replaceChildren();
                                    const loading = document.createElement('div');
                                    loading.className = 'px-8 py-1 text-[10px] text-gray-600';
                                    loading.textContent = 'Loading...';
                                    subContainer.appendChild(loading);
                                    await renderTree(fullPath, subContainer, null);
                                }
                            } else {
                                setRowExpanded(row, subContainer, false);
                                lucide.createIcons();
                            }
                        });

                        itemWrapper.appendChild(row);
                        itemWrapper.appendChild(subContainer);
                        container.appendChild(itemWrapper);

                        if (expandedPaths && expandedPaths.has(fullPath)) {
                            setRowExpanded(row, subContainer, true);
                            await renderTree(fullPath, subContainer, expandedPaths);
                        }
                    } else {
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            highlightFileRow(fullPath);
                            openFile(fullPath);
                        });
                        itemWrapper.appendChild(row);
                        container.appendChild(itemWrapper);
                    }
                }
                lucide.createIcons();
            } catch (e) {
                console.error('Tree Load Error:', e);
                container.replaceChildren();
                const err = document.createElement('div');
                err.className = 'px-8 py-1 text-red-500 text-[10px]';
                err.textContent = 'Access denied or empty';
                container.appendChild(err);
            }
        }

        function highlightFileRow(path) {
            document.querySelectorAll('.file-row[data-is-dir="false"]').forEach(r => {
                r.classList.toggle('active', r.dataset.path === path);
            });
        }

        function showWelcome() {
            document.getElementById('welcome').classList.remove('hidden');
            document.getElementById('file-view').classList.add('hidden');
            updateToolbar();
        }

        function showFileView() {
            document.getElementById('welcome').classList.add('hidden');
            const view = document.getElementById('file-view');
            view.classList.remove('hidden');
            return view;
        }

        function openFile(path) {
            let tab = tabsByPath.get(path);
            if (tab) {
                activateTab(tab.id);
                return;
            }

            const filename = path.split('/').filter(Boolean).pop() || path;
            const isHtml = path.endsWith('.html');
            const isMarkdown = isMarkdownPath(path);
            tab = {
                id: ++tabIdSeq,
                path,
                filename,
                text: '',
                mode: (isHtml || isMarkdown) ? 'preview' : 'code',
                wrap: true,
                isHtml,
                isMarkdown,
                isMedia: isMediaPath(path),
            };
            tabs.push(tab);
            tabsByPath.set(path, tab);
            activateTab(tab.id);
        }

        async function loadTabContent(tab, rerenderIfActive) {
            if (tab.id === activeTabId) {
                const area = showFileView();
                area.replaceChildren();
                const loading = document.createElement('div');
                loading.className = 'flex items-center justify-center h-full text-[10px] text-gray-600 tracking-widest animate-pulse';
                loading.textContent = 'STREAMING DATA...';
                area.appendChild(loading);
            }

            if (tab.isMedia) {
                if (tab.id === activeTabId || rerenderIfActive) renderTabContent(tab);
                return;
            }

            try {
                const response = await fetch(bustUrl(tab.path), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const buffer = await response.arrayBuffer();
                tab.text = new TextDecoder('utf-8').decode(buffer);
                if (tab.id === activeTabId || rerenderIfActive) renderTabContent(tab);
            } catch (e) {
                if (tab.id === activeTabId) {
                    const area = showFileView();
                    area.replaceChildren();
                    const err = document.createElement('div');
                    err.className = 'p-10 text-red-500 text-xs font-mono';
                    err.textContent = `ERROR: ${e.message}`;
                    area.appendChild(err);
                }
            }
        }

        function renderTabBar() {
            const bar = document.getElementById('tab-bar');
            bar.replaceChildren();
            tabs.forEach(tab => {
                const tabBtn = document.createElement('div');
                tabBtn.className = `tab-item cursor-pointer ${tab.id === activeTabId ? 'active' : ''}`;
                tabBtn.setAttribute('role', 'tab');
                tabBtn.setAttribute('aria-selected', tab.id === activeTabId ? 'true' : 'false');

                const label = document.createElement('span');
                label.className = 'truncate';
                label.textContent = tab.filename;

                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.className = 'tab-close shrink-0';
                closeBtn.setAttribute('aria-label', `Close ${tab.filename}`);
                const closeIcon = document.createElement('i');
                closeIcon.setAttribute('data-lucide', 'x');
                closeIcon.className = 'w-3 h-3';
                closeBtn.appendChild(closeIcon);

                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeTab(tab.id);
                });

                tabBtn.addEventListener('click', () => activateTab(tab.id));

                tabBtn.appendChild(label);
                tabBtn.appendChild(closeBtn);
                bar.appendChild(tabBtn);
            });
            lucide.createIcons();
        }

        function activateTab(id) {
            activeTabId = id;
            const tab = getActiveTab();
            renderTabBar();
            updateToolbar();
            if (!tab) return;
            highlightFileRow(tab.path);
            if (tab.isMedia || tab.text !== '') {
                renderTabContent(tab);
            } else {
                loadTabContent(tab, true);
            }
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const tab = tabs[idx];
            tabs.splice(idx, 1);
            tabsByPath.delete(tab.path);

            if (tab.id !== activeTabId) {
                renderTabBar();
                return;
            }

            if (tabs.length === 0) {
                activeTabId = null;
                renderTabBar();
                document.querySelectorAll('.file-row.active').forEach(r => r.classList.remove('active'));
                showWelcome();
                return;
            }

            const newIdx = Math.min(idx, tabs.length - 1);
            activateTab(tabs[newIdx].id);
        }

        function updateToolbar() {
            const tab = getActiveTab();
            const htmlToggle = document.getElementById('html-toggle');
            const btnWrap = document.getElementById('btn-wrap');
            const btnP = document.getElementById('btn-preview');
            const btnC = document.getElementById('btn-code');

            if (!tab) {
                htmlToggle.classList.add('hidden');
                btnWrap.classList.add('hidden');
                return;
            }

            if (tabHasPreview(tab)) {
                htmlToggle.classList.remove('hidden');
                if (tab.mode === 'preview') {
                    btnP.className = 'px-3 py-1 rounded text-[10px] bg-[#007acc] text-white font-bold';
                    btnC.className = 'px-3 py-1 rounded text-[10px] text-gray-400 hover:text-white';
                } else {
                    btnC.className = 'px-3 py-1 rounded text-[10px] bg-[#007acc] text-white font-bold';
                    btnP.className = 'px-3 py-1 rounded text-[10px] text-gray-400 hover:text-white';
                }
            } else {
                htmlToggle.classList.add('hidden');
            }

            const showWrap = tab && !tab.isMedia && (!tabHasPreview(tab) || tab.mode === 'code');
            if (showWrap) {
                btnWrap.classList.remove('hidden');
                if (tab.wrap) {
                    btnWrap.className = 'px-3 py-1 rounded text-[10px] uppercase font-bold transition-all bg-[#007acc] text-white';
                    btnWrap.title = 'Word wrap is on (click to disable)';
                } else {
                    btnWrap.className = 'px-3 py-1 rounded text-[10px] uppercase font-bold transition-all bg-[#333] text-gray-400 hover:text-white';
                    btnWrap.title = 'Word wrap is off (click to enable)';
                }
            } else {
                btnWrap.classList.add('hidden');
            }
        }

        function renderTabContent(tab) {
            const area = showFileView();
            area.replaceChildren();
            area.scrollTop = 0;

            if (tab.isMedia) {
                const iframe = document.createElement('iframe');
                iframe.src = bustUrl(tab.path);
                area.appendChild(iframe);
                return;
            }

            if (tab.isHtml && tab.mode === 'preview') {
                const iframe = document.createElement('iframe');
                iframe.src = bustUrl(tab.path);
                area.appendChild(iframe);
                return;
            }

            if (tab.isMarkdown && tab.mode === 'preview') {
                const previewResult = renderMarkdownPreview(area, tab.text);
                if (previewResult.ok) return;
                tab.mode = 'code';
                updateToolbar();
                const errBanner = document.createElement('div');
                errBanner.className = 'preview-error';
                errBanner.textContent = previewResult.error;
                area.appendChild(errBanner);
                renderCodeInto(area, tab.text, tab.filename, tab.wrap);
                return;
            }

            renderCodeInto(area, tab.text, tab.filename, tab.wrap);
        }

        function renderMarkdownPreview(area, text) {
            if (!markdownLibsReady()) {
                return { ok: false, error: 'Markdown preview unavailable: marked or DOMPurify failed to load.' };
            }
            try {
                const parsed = marked.parse(text, { async: false });
                const html = typeof parsed === 'string' ? parsed : '';
                const clean = DOMPurify.sanitize(html);
                const wrap = document.createElement('div');
                wrap.className = 'md-preview';
                wrap.innerHTML = clean;
                area.appendChild(wrap);
                return { ok: true };
            } catch (e) {
                return { ok: false, error: `Markdown preview failed: ${e.message}` };
            }
        }

        function renderCodeInto(area, text, filename, wrap) {
            const lower = filename.toLowerCase();
            let lang = 'text';
            if (lower.endsWith('.markdown')) lang = 'markdown';
            else {
                const ext = filename.split('.').pop();
                const langMap = { py: 'python', md: 'markdown', json: 'json', js: 'javascript', html: 'html' };
                lang = langMap[ext] || 'text';
            }
            const wrapClass = wrap ? 'code-wrap' : 'code-nowrap';

            const pre = document.createElement('pre');
            pre.className = `language-${lang} ${wrapClass}`;
            const code = document.createElement('code');
            code.className = `language-${lang} ${wrapClass}`;
            code.textContent = text;
            pre.appendChild(code);
            area.appendChild(pre);
            Prism.highlightElement(code);
        }

        function switchMode(mode) {
            const tab = getActiveTab();
            if (!tab || !tabHasPreview(tab)) return;
            tab.mode = mode;
            updateToolbar();
            renderTabContent(tab);
        }

        function toggleWrap() {
            const tab = getActiveTab();
            if (!tab || tab.isMedia) return;
            if (tabHasPreview(tab) && tab.mode === 'preview') return;
            tab.wrap = !tab.wrap;
            updateToolbar();
            renderTabContent(tab);
        }

        async function refreshWorkspace() {
            const expanded = collectExpandedPaths();
            const fileList = document.getElementById('file-list');
            await renderTree('', fileList, expanded);
            const tab = getActiveTab();
            if (tab) await loadTabContent(tab, true);
        }

        document.getElementById('btn-refresh-workspace').addEventListener('click', () => {
            refreshWorkspace();
        });
        document.getElementById('btn-preview').addEventListener('click', () => switchMode('preview'));
        document.getElementById('btn-code').addEventListener('click', () => switchMode('code'));
        document.getElementById('btn-wrap').addEventListener('click', () => toggleWrap());

        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', stopResizing);
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        function handleMouseMove(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 160 && newWidth < 600) sidebar.style.width = `${newWidth}px`;
        }

        function stopResizing() {
            isResizing = false;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', stopResizing);
            document.body.style.cursor = 'default';
            document.body.style.userSelect = 'auto';
        }

        renderTree('', document.getElementById('file-list'), null);
        lucide.createIcons();
    </script>
</body>

</html>
